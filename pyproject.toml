[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bundle-adjustment"
version = "0.1.0a0"
description = "A dependable Python bundle-adjustment library and command-line tool"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Bundle Adjustment Tool contributors" },
]
keywords = ["bundle-adjustment", "photogrammetry", "computer-vision", "sfm", "slam"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]
viz = [
  "matplotlib>=3.7",
]

[project.scripts]
bundle-adjust = "bundle_adjustment.cli:main"

[project.urls]
Repository = "https://github.com/YOUR_USERNAME/Bundle_adjustment_tool"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bundle_adjustment*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["bundle_adjustment"]

[tool.mypy]
python_version = "3.10"
files = ["src/bundle_adjustment"]
strict = true
warn_unused_ignores = true
